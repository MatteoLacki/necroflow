# Container settings shared by every scientific rule.
[docker]
platform = "linux/amd64"
run_args = [
    "--rm",
    "--init",
    "--pull=never",  # `make setup` pulls and verifies images first
    "--user={uid}:{gid}",
    "--env=HOME=/tmp",
    "--network=none",
    "--cpus=1",
    "--memory=2g",
]

